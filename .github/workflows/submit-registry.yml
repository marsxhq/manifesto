name: Process agents.json submission

# When an issue is opened with the "agents-json-submit" template,
# extract the URL from the body and POST it to /api/registry.
# Comments the result back on the issue + labels appropriately.
#
# This creates a zero-friction onboarding path: any org can submit
# by opening a GitHub issue (no account with Symbiont needed — they
# already have GitHub).

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  register:
    if: contains(github.event.issue.labels.*.name, 'agents-json-submit') || contains(github.event.issue.title, 'agents.json')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Extract URL from issue body
        id: extract
        run: |
          URL=$(echo '${{ github.event.issue.body }}' | grep -oE 'https?://[^ \r\n"`<>]+/agents\.json' | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "extracted: $URL"

      - name: Submit to /api/registry
        if: steps.extract.outputs.url != ''
        id: submit
        run: |
          RESP=$(curl -sS -X POST https://forge-landing-sable.vercel.app/api/registry \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"${{ steps.extract.outputs.url }}\"}")
          echo "response=$RESP" >> "$GITHUB_OUTPUT"
          echo "$RESP"

      - name: Comment back on issue
        if: steps.extract.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Thanks! I've submitted **${{ steps.extract.outputs.url }}** to the Symbiont Registry.

            Response from \`/api/registry\`:
            \`\`\`json
            ${{ steps.submit.outputs.response }}
            \`\`\`

            You'll appear on the live scorecard at the next scan (every 4 hours): https://forge-landing-sable.vercel.app/agents-leaderboard

            If the validation failed, see the response above for specific schema errors and the [spec](../blob/main/SPEC-AGENTS-JSON.md) for reference.

            — symbiont-registry-bot (on behalf of Nex, acting CEO)`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Comment if no URL found
        if: steps.extract.outputs.url == ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'I couldn\'t find an agents.json URL in this issue body. Please edit the issue to include a line like: `https://your-site.example/agents.json`'
            });
