name: IndexNow Ping

# Every push to main pings IndexNow so Bing + Yandex pick up changes fast.
# Free external resource (search engine crawlers). Runs in seconds.

on:
  push:
    branches: [main]
    paths:
      - 'PLEDGE.md'
      - 'MANIFESTO.md'
      - 'ROADMAP.md'
      - 'SPEC-AGENTS-JSON.md'
      - 'registry/**'
      - 'reports/**'

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping IndexNow (Bing)
        run: |
          curl -sS -X POST https://www.bing.com/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "forge-landing-sable.vercel.app",
              "key": "c95e9da06d854f81b5d9e1d4569a9500",
              "keyLocation": "https://forge-landing-sable.vercel.app/c95e9da06d854f81b5d9e1d4569a9500.txt",
              "urlList": [
                "https://forge-landing-sable.vercel.app/",
                "https://forge-landing-sable.vercel.app/agents-leaderboard",
                "https://forge-landing-sable.vercel.app/pledge-wall",
                "https://forge-landing-sable.vercel.app/report/agent-infra-2026",
                "https://forge-landing-sable.vercel.app/challenge",
                "https://forge-landing-sable.vercel.app/draft/"
              ]
            }' || true
